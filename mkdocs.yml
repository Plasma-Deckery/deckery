site_name: Deckery
site_url: https://plasma-deckery.github.io/deckery/
repo_url: https://github.com/Plasma-Deckery/deckery
repo_name: Plasma-Deckery/deckery
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home:
    - index.md
    - Setup Guide: setup-guide.md
    - Configuration: configuration.md
    - Progress & Challenges: progress-and-challenges.md
  - Projects:
    - projects/index.md
    - Own Projects:
      - Deckery HUD: projects/deckery-hud.md
      - Makima Deckery:
        - projects/makima-deckery/index.md
        - App Config: projects/makima-deckery/app-config.md
        - Bindings: projects/makima-deckery/bindings.md
        - Trackpad: projects/makima-deckery/trackpad.md
      - Deckery Tray: projects/deckery-tray.md
      - Steam Deck Dotfiles:
        - projects/steamdeck-dotfiles/index.md
        - Chezmoi & Tracking: projects/steamdeck-dotfiles/chezmoi.md
    - Forked Tools:
      - Kyanite: projects/kyanite.md
      - maximized-window-gaps: projects/maximized-window-gaps.md
    - Further Tools:
      - Kröhnkite: projects/krohnkite.md
      - OpenWhispr: projects/openwhispr.md
  - Development:
    - Development Guide: development.md
    - Architecture: reference/architecture.md
    - Installer Script: reference/installer-script.md
    - Updates: reference/updates.md
    - IPC: reference/ipc.md
    - State JSON: reference/state-json.md
    - Steam Input Mapping: reference/steam-input-mapping.md
