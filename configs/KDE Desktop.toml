# KDE Desktop — window control, independent of how desktops are arranged.
#
# Everything that depends on the virtual-desktop arrangement lives in the three
# KDE Desktop Layout modules instead, of which exactly one is ever active. What
# is left here — maximize, close, window menu, desktop grid overview — means the
# same thing whichever of them you picked.
#
# A Hyprland port is a re-think of this file, not a translation of it.
#
# Plain module: names no device and no window class, so it is merged into every
# base config automatically — gated only by requires_compositor below.
#
# Note: KrohnkiteToggleFloat needs the Krohnkite KWin script installed.
# Everything else here uses stock KWin shortcuts.

[module]
requires_compositor = "KDE"

[remap]
L1-Start = { keys = ["KEY_LEFTALT", "KEY_F3"], label = "Window Menu" }

[commands]
# --- L1+R1+Face → Window management ---
L1-R1-A = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Fullscreen'"], label = "Fullscreen" }
L1-R1-X = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Maximize'"], label = "Maximize/Restore" }
L1-R1-Y = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'KrohnkiteToggleFloat'"], label = "Toggle Float" }
L1-R1-B = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Close'"], label = "Close Window" }

L1-Select = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Grid View'"], label = "Desktop Grid" }

# --- L1+R1+Select → send the window back where it came from ---
L1-R1-Select = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'deckery-move-window-to-last-desktop'"], label = "Window to Last Desktop" }

[hints]
KEY_LEFTALT-KEY_TAB = "Tab (Switch Windows)"
