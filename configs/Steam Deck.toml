# Deckery — Steam Deck Default Config
# Phase 1: GRAB_DEVICE = "false" → makima und Steam Input laufen parallel
# Kein Konflikt, kein Ausfall. Erst testen, dann GRAB_DEVICE = "true" setzen.
#
# Button-Referenz Steam Deck:
#   BTN_SOUTH   = A        BTN_NORTH   = X  (Kernel: BTN_X = BTN_NORTH = 307)
#   BTN_EAST    = B        BTN_WEST    = Y  (Kernel: BTN_Y = BTN_WEST  = 308)
#   BTN_TL      = L1       BTN_TR      = R1
#   ABS_Z       = L2 (Trigger analog)
#   ABS_RZ      = R2 (Trigger analog)
#   BTN_THUMBL  = L3       BTN_THUMBR  = R3
#   BTN_SELECT  = Select   BTN_START   = Start
#   BTN_MODE    = Steam Button

[remap]
# --- Maus-Klicks (Trigger als Buttons) ---
BTN_TL2 = { keys = ["BTN_RIGHT"], no_pause = true }  # L2 → Rechtsklick
BTN_TR2 = { keys = ["BTN_LEFT"],  no_pause = true }  # R2 → Linksklick

# --- Basis-Navigation ---
BTN_DPAD_UP    = ["KEY_UP"]
BTN_DPAD_DOWN  = ["KEY_DOWN"]
BTN_DPAD_LEFT  = ["KEY_LEFT"]
BTN_DPAD_RIGHT = ["KEY_RIGHT"]
BTN_SOUTH      = ["KEY_ENTER"]   # A
BTN_EAST       = ["KEY_ESC"]     # B
BTN_NORTH      = ["KEY_BACKSPACE"]  # X  (BTN_NORTH = BTN_X = physisch X-Button)
BTN_WEST       = ["KEY_SPACE"]   # Y  (BTN_WEST  = BTN_Y = physisch Y-Button)
BTN_SELECT     = ["KEY_TAB"]
BTN_START      = ["KEY_LEFTMETA"]

# --- Layer-Modifier-Buttons (CUSTOM_MODIFIERS + Remap) ---
# Diese Buttons senden beim Halten den Output-Key als echten System-Modifier
# UND agieren als Layer-Modifier für Combos (BTN_TL-* combos).
BTN_TL = []   # L1 → reiner Layer-Modifier, kein Output-Key
BTN_TR = []   # R1 → reiner Layer-Modifier, kein Output-Key

# --- Internal Modifier: Steam Button ---
# BTN_MODE (Steam Button) ist als Internal Modifier in CUSTOM_MODIFIERS definiert.
# Es wird NICHT direkt remapped (kein BTN_MODE = [...]), sondern nur für Combos genutzt.
# State-Tracking: BTN_MODE wird in held_modifiers (state.json) exportiert.
# Combos: BTN_MODE-BTN_* prefix für combo-Bindings (z.B. BTN_MODE-BTN_NORTH, BTN_MODE-BTN_GRIPR2)

# --- Rechter Stick ---
BTN_THUMBR = ["BTN_LEFT"]   # R3 → Linksklick

# --- Back-Paddles ---
BTN_GRIPL   = ["KEY_LEFTSHIFT"]  # L4 (oben links)   → Shift
BTN_GRIPL2  = ["KEY_LEFTMETA"]   # L5 (unten links)  → Super/Win
BTN_GRIPR   = ["KEY_LEFTALT"]    # R4 (oben rechts)  → Alt
BTN_GRIPR2  = ["KEY_LEFTCTRL"]  # R5 (unten rechts) → Ctrl

# --- L1+X/Y → Copy/Paste ---
BTN_TL-BTN_NORTH = { keys = ["KEY_LEFTCTRL", "KEY_C"], label = "Copy (Ctrl+C)" }   # L1+X
BTN_TL-BTN_WEST  = { keys = ["KEY_LEFTCTRL", "KEY_V"], label = "Paste (Ctrl+V)" }  # L1+Y


# --- Sprachsteuerung: L1 + R5 → OpenWhispr (Ctrl + PageDown) ---
BTN_TL-BTN_GRIPR2 = { keys = ["KEY_LEFTCTRL", "KEY_PAGEDOWN"], label = "Text to Speech (Ctrl+PgDn)" }

# --- Steam-Layer: Steam+X → OSK (Steam Input übernimmt, makima blockt Backspace) ---
BTN_MODE-BTN_NORTH = { keys = [], label = "(Steam OSK)" }  # Steam+X: makima tut nichts, Steam Input öffnet OSK

# --- QAM-Button (Drei Punkte) ---
# BTN_BASE = ["..."]  # ← TODO: Belegung festlegen

[commands]
BTN_THUMBL = { run = ["deckery-hud-toggle"], no_pause = true, label = "Toggle HUD" }  # L3 → Deckery HUD ein/ausblenden

# --- L1 + Pfeiltasten → KDE Virtual Desktop wechseln ---
BTN_TL-BTN_DPAD_UP    = { run = ["qdbus org.kde.KWin /KWin previousDesktop"], label = "Previous Desktop" }
BTN_TL-BTN_DPAD_DOWN  = { run = ["qdbus org.kde.KWin /KWin nextDesktop"], label = "Next Desktop" }

# --- L1+R1+DPad → Fenster auf anderen Virtual Desktop schieben ---
BTN_TL-BTN_TR-BTN_DPAD_UP    = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window One Desktop Up'"],   label = "Window to Previous Desktop" }
BTN_TL-BTN_TR-BTN_DPAD_DOWN  = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window One Desktop Down'"], label = "Window to Next Desktop" }
BTN_TL-BTN_TR-BTN_DPAD_RIGHT = { run = ["bash -c 'N=$(qdbus org.kde.KWin /KWin numberOfDesktops); for i in $(seq $(qdbus org.kde.KWin /KWin currentDesktop) $((N-1))); do qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut \"Window One Desktop to the Right\"; done'"], label = "Window to Last Desktop" }

# --- L1+R1+Face → Fensterverwaltung ---
BTN_TL-BTN_TR-BTN_SOUTH = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Fullscreen'"],     label = "Fullscreen" }         # L1+R1+A
BTN_TL-BTN_TR-BTN_NORTH = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Maximize'"],        label = "Maximize/Restore" }  # L1+R1+X
BTN_TL-BTN_TR-BTN_WEST  = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'KrohnkiteToggleFloat'"], label = "Toggle Float" }       # L1+R1+Y
BTN_TL-BTN_TR-BTN_EAST  = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Close'"],         label = "Close Window" }       # L1+R1+B

[settings]
# Linker Stick → deaktiviert (Kando nutzt Achswerte direkt via Gamepad API)
CUSTOM_MODIFIERS = "BTN_TL-BTN_TR-BTN_MODE"   # Layer-Modifier-Buttons

LSTICK = "disabled"

# Trackpads → virtuelle MT-Touchpad-Devices (libinput übernimmt Verhalten)
LPAD = "trackpad"
RPAD = "trackpad"

# Rechter Stick → Maus (makima übernimmt, Steam group 25 inactive)
RSTICK = "cursor"
RSTICK_SENSITIVITY = "4"   # Polling-Intervall in ms (4 = 250Hz)
RSTICK_DEADZONE = "15"    # Deadzone gegen Stick-Drift (Wert * 200 = Raw-Threshold)

16_BIT_AXIS = "true"   # Steam Deck nutzt 16-bit Achswerte wie Xbox
GRAB_DEVICE = "false"  # PHASE 1: false = safe, kein Konflikt mit Steam Input
                       # PHASE 2: auf "true" setzen + Steam Desktop Config deaktivieren
