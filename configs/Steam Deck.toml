# Deckery — Steam Deck Base Config

[device]
class = "hid-steam"
names = ["Steam Deck", "Valve Software Steam Controller"]

# Readable button names for this hardware. Declared once here and in effect for
# every file in this directory, modules and app overrides included. Kernel names
# keep working alongside them. Combos join with `-`.
# Paddles L4/R4 are the top pair, L5/R5 the bottom pair.
aliases = { A = "BTN_SOUTH", B = "BTN_EAST", X = "BTN_NORTH", Y = "BTN_WEST", L1 = "BTN_TL", R1 = "BTN_TR", L2 = "BTN_TL2", R2 = "BTN_TR2", L3 = "BTN_THUMBL", R3 = "BTN_THUMBR", L4 = "BTN_GRIPL", L5 = "BTN_GRIPL2", R4 = "BTN_GRIPR", R5 = "BTN_GRIPR2", Up = "BTN_DPAD_UP", Down = "BTN_DPAD_DOWN", Left = "BTN_DPAD_LEFT", Right = "BTN_DPAD_RIGHT", Select = "BTN_SELECT", Start = "BTN_START", Steam = "BTN_MODE" }

# A stack: every module sits below this file, so anything bound here wins over
# all of them. Among the modules themselves the last entry outranks the earlier
# ones — general layers first, specific opt-ins last.
[modules]
include = [
  "KDE Desktop",
  "Hyprland Desktop",
  "Voice Control",
]

[remap]
# --- Mouse clicks (triggers as buttons) ---
L2 = { keys = ["BTN_RIGHT"], no_pause = true, silent = true }
R2 = { keys = ["BTN_LEFT"],  no_pause = true, silent = true }

# --- Basic navigation ---
Up     = ["KEY_UP"]
Down   = ["KEY_DOWN"]
Left   = ["KEY_LEFT"]
Right  = ["KEY_RIGHT"]
A      = ["KEY_ENTER"]
B      = ["KEY_ESC"]
X      = ["KEY_BACKSPACE"]
Y      = ["KEY_SPACE"]
Start  = ["KEY_F10"]   # three-stripes button → menu bar
Select = ["KEY_TAB"]

# Not redundant: a modifier that is held and released without any combo firing
# taps its raw button through to the virtual gamepad. The empty output is what
# suppresses that, so L1/R1 stay pure layer keys.
L1 = []
R1 = []

# --- Right stick ---
R3 = ["BTN_LEFT"]

# --- Back paddles ---
L4 = ["KEY_LEFTSHIFT"]
L5 = ["KEY_LEFTMETA"]
R4 = ["KEY_LEFTALT"]
R5 = ["KEY_LEFTCTRL"]

# --- L1 layer: Copy/Paste, Undo/Redo ---
L1-X = { keys = ["KEY_LEFTCTRL", "KEY_C"], label = "Copy" }
L1-Y = { keys = ["KEY_LEFTCTRL", "KEY_V"], label = "Paste" }
L1-B = { keys = ["KEY_LEFTCTRL", "KEY_Z"], label = "Undo" }
L1-A = { keys = ["KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_Z"], label = "Redo" }

# --- Steam layer: makima stays out of the way, Steam Input handles both ---
Steam-X = { keys = [], label = "(Steam Keyboard)" }
Steam-B = { keys = [], label = "(Handheld Daemon)" }

[commands]
L3 = { run = ["deckery-hud-toggle"], no_pause = true, silent = true, label = "Toggle HUD" }

[settings]
# Buttons that act as layer modifiers. Left empty on purpose: any button used
# on the left side of a combo (L1-X, Steam-B, ...) is registered automatically.
# This setting is only needed to declare a modifier that appears in no combo.
CUSTOM_MODIFIERS = ""

# Right stick → mouse (makima takes over, Steam group 25 inactive)
RSTICK = "cursor"
RSTICK_SENSITIVITY = "4"   # Polling interval in ms (4 = 250Hz)
RSTICK_DEADZONE = "15"     # Deadzone against stick drift (value * 200 = raw threshold)
LSTICK_DEADZONE = "15"     # Same drift threshold for the left stick

16_BIT_AXIS = "true"   # Steam Deck uses 16-bit axis values like Xbox

# ── Gaming Mode ───────────────────────────────────────────────────────────────
# Both values below are the built-in defaults, written out so it is visible that
# the knob exists. Deleting the whole section changes nothing.

[gaming_mode]
# Double-click this button to toggle Gaming Mode. key = "disabled" turns the
# trigger off; ms is the maximum gap between the two clicks.
trigger = { key = "BTN_BASE", ms = 400 }   # QAM (···)

# Also enable Gaming Mode on its own when a Steam game or Big Picture is focused.
auto_detect_steam_games = true

# ── Trackpads ─────────────────────────────────────────────────────────────────

[trackpad]
combined_gesture_device = true

[trackpad.right]
mode = "mt-trackpad"
click_pressure = 30000   # Firmware click-pressure threshold, raw u16

# on_movement fires at most once per `pixel_interval` raw units of travel.
[trackpad.right.haptic]
on_press   = { duration_us = 8000, interval_us = 8000, count = 3, gain_db = 0 }
on_release = { duration_us = 8000, interval_us = 8000, count = 3, gain_db = 0 }
# on_movement = { pixel_interval = 3000, duration_us = 4000, interval_us = 4000, count = 1, gain_db = 0 }

# KDE/libinput settings written to kcminputrc for this pad's virtual device.
[trackpad.right.kde]
pointer_acceleration = 0.2
pointer_acceleration_profile = "flat"   # or "adaptive"
tap_to_click = false

[trackpad.left]
mode = "disabled"

[trackpad.gestures.kde]
natural_scroll = true
scroll_factor = 0.5
tap_to_click = false
