# Deckery — Steam Deck Hardware Descriptor
#
# This file answers "what device is this", nothing else. Bindings, settings and
# trackpad configuration live in their own modules next to it, so customising
# any one of them does not mean taking ownership of all of them: an override
# replaces a whole file, and the files you did not override keep receiving
# updates.

[device]
class = "hid-steam"
names = ["Steam Deck", "Valve Software Steam Controller"]

# Readable button names for this hardware. Declared once here and in effect for
# every file in the config directories, modules and app overrides included.
# Kernel names keep working alongside them. Combos join with `-`.
# Paddles L4/R4 are the top pair, L5/R5 the bottom pair.
aliases = { A = "BTN_SOUTH", B = "BTN_EAST", X = "BTN_WEST", Y = "BTN_NORTH", L1 = "BTN_TL", R1 = "BTN_TR", L2 = "BTN_TL2", R2 = "BTN_TR2", L3 = "BTN_THUMBL", R3 = "BTN_THUMBR", L4 = "BTN_GRIPL", L5 = "BTN_GRIPL2", R4 = "BTN_GRIPR", R5 = "BTN_GRIPR2", Up = "BTN_DPAD_UP", Down = "BTN_DPAD_DOWN", Left = "BTN_DPAD_LEFT", Right = "BTN_DPAD_RIGHT", Select = "BTN_SELECT", Start = "BTN_START", Steam = "BTN_MODE" }

# ── Gaming Mode ───────────────────────────────────────────────────────────────
# Stays here rather than in a module of its own: it is a device-level concern
# like [device] itself, and the merge treats the base config as the authority
# for it — Gaming Mode set in a module would be discarded without a word.
#
# Both values below are the built-in defaults, written out so it is visible that
# the knob exists. Deleting the whole section changes nothing.

[gaming_mode]
# Double-click this button to toggle Gaming Mode. key = "disabled" turns the
# trigger off; ms is the maximum gap between the two clicks.
trigger = { key = "BTN_BASE", ms = 400 }   # QAM (···)

# Also enable Gaming Mode on its own when a Steam game or Big Picture is focused.
auto_detect_steam_games = true
