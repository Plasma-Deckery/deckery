# Deckery — Steam Deck Default Config
#
# Steam Deck button reference:
#   BTN_SOUTH   = A        BTN_NORTH   = X  (kernel: BTN_X = BTN_NORTH = 307)
#   BTN_EAST    = B        BTN_WEST    = Y  (kernel: BTN_Y = BTN_WEST  = 308)
#   BTN_TL      = L1       BTN_TR      = R1
#   ABS_Z       = L2 (analog trigger)
#   ABS_RZ      = R2 (analog trigger)
#   BTN_THUMBL  = L3       BTN_THUMBR  = R3
#   BTN_SELECT  = Select   BTN_START   = Start (☰)
#   BTN_MODE    = Steam Button
#   BTN_BASE    = QAM (···)

[remap]
# --- Mouse clicks (triggers as buttons) ---
BTN_TL2 = { keys = ["BTN_RIGHT"], no_pause = true, silent = true }  # L2 → right-click
BTN_TR2 = { keys = ["BTN_LEFT"],  no_pause = true, silent = true }  # R2 → left-click

# --- Basic navigation ---
BTN_DPAD_UP    = ["KEY_UP"]
BTN_DPAD_DOWN  = ["KEY_DOWN"]
BTN_DPAD_LEFT  = ["KEY_LEFT"]
BTN_DPAD_RIGHT = ["KEY_RIGHT"]
BTN_SOUTH      = ["KEY_ENTER"]      # A
BTN_EAST       = ["KEY_ESC"]        # B
BTN_NORTH      = ["KEY_BACKSPACE"]  # X  (BTN_NORTH = BTN_X = physical X button)
BTN_WEST       = ["KEY_SPACE"]      # Y  (BTN_WEST  = BTN_Y = physical Y button)
BTN_START      = ["KEY_F10"]        # three-stripes button (right) → menu bar
BTN_SELECT     = ["KEY_TAB"]        # View button (left) → Tab

# --- Layer-modifier buttons (CUSTOM_MODIFIERS + Remap) ---
# These buttons emit their output key as a real system modifier when held
# AND act as layer-modifiers for combos (BTN_TL-* combos).
BTN_TL = []   # L1 → pure layer-modifier, no output key
BTN_TR = []   # R1 → pure layer-modifier, no output key

# --- Internal Modifier: Steam Button ---
# BTN_MODE (Steam Button) is defined as an internal modifier in CUSTOM_MODIFIERS.
# It is NOT directly remapped (no BTN_MODE = [...]), only used for combos.
# State tracking: BTN_MODE is exported in held_modifiers (state.json).
# Combos: BTN_MODE-BTN_* prefix for combo bindings (e.g. BTN_MODE-BTN_NORTH, BTN_MODE-BTN_GRIPR2)

# --- Right stick ---
BTN_THUMBR = ["BTN_LEFT"]   # R3 → left-click

# --- Back paddles ---
BTN_GRIPL   = ["KEY_LEFTSHIFT"]  # L4 (top left)    → Shift
BTN_GRIPL2  = ["KEY_LEFTMETA"]   # L5 (bottom left) → Super/Win
BTN_GRIPR   = ["KEY_LEFTALT"]    # R4 (top right)   → Alt
BTN_GRIPR2  = ["KEY_LEFTCTRL"]   # R5 (bottom right) → Ctrl

# --- L1+X/Y → Copy/Paste  |  L1+B/A → Undo/Redo ---
BTN_TL-BTN_NORTH = { keys = ["KEY_LEFTCTRL", "KEY_C"],                  label = "Copy" }   # L1+X
BTN_TL-BTN_WEST  = { keys = ["KEY_LEFTCTRL", "KEY_V"],                  label = "Paste" }  # L1+Y
BTN_TL-BTN_EAST  = { keys = ["KEY_LEFTCTRL", "KEY_Z"],                  label = "Undo" }   # L1+B
BTN_TL-BTN_SOUTH = { keys = ["KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_Z"], label = "Redo" }   # L1+A


# --- Voice control: L1 + R5 → OpenWhispr (Ctrl + PageDown) ---
BTN_TL-BTN_GRIPR2 = { keys = ["KEY_LEFTCTRL", "KEY_PAGEDOWN"], label = "Text to Speech (Ctrl+PgDn)" }

# --- Steam layer: Steam+X → Keyboard, Steam+B → Handheld Daemon (Steam Input handles both) ---
BTN_MODE-BTN_NORTH = { keys = [], label = "(Steam Keyboard)" }     # Steam+X: makima does nothing, Steam Input opens OSK
BTN_MODE-BTN_EAST  = { keys = [], label = "(Handheld Daemon)" }    # Steam+B: makima does nothing, handheld daemon handles it

# --- L1 + Start (three stripes) → Window Menu ---
BTN_TL-BTN_START = { keys = ["KEY_LEFTALT", "KEY_F3"], label = "Window Menu" }

[commands]
# --- L3 → Toggle Deckery HUD ---
BTN_THUMBL = { run = ["deckery-hud-toggle"], no_pause = true, silent = true, label = "Toggle HUD" }

# --- L1 + SELECT → Desktop Grid ---
BTN_TL-BTN_SELECT = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Grid View'"], label = "Desktop Grid" }

# --- L1 + DPad → KDE Virtual Desktop / Activity switching ---
BTN_TL-BTN_DPAD_UP    = { run = ["qdbus org.kde.KWin /KWin previousDesktop"], label = "Previous Desktop" }
BTN_TL-BTN_DPAD_DOWN  = { run = ["qdbus org.kde.KWin /KWin nextDesktop"], label = "Next Desktop" }
BTN_TL-BTN_DPAD_LEFT  = { run = ["qdbus org.kde.ActivityManager /ActivityManager/Activities org.kde.ActivityManager.Activities.PreviousActivity"], label = "Previous Activity" }
BTN_TL-BTN_DPAD_RIGHT = { run = ["qdbus org.kde.ActivityManager /ActivityManager/Activities org.kde.ActivityManager.Activities.NextActivity"], label = "Next Activity" }

# --- L1+R1+DPad → Move window to another virtual desktop ---
BTN_TL-BTN_TR-BTN_DPAD_UP    = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window One Desktop Up'"],   label = "Window to Previous Desktop" }
BTN_TL-BTN_TR-BTN_DPAD_DOWN  = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window One Desktop Down'"], label = "Window to Next Desktop" }
BTN_TL-BTN_TR-BTN_DPAD_RIGHT = { run = ["bash -c 'N=$(qdbus org.kde.KWin /KWin numberOfDesktops); for i in $(seq $(qdbus org.kde.KWin /KWin currentDesktop) $((N-1))); do qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut \"Window One Desktop to the Right\"; done'"], label = "Window to Last Desktop" }

# --- L1+R1+Face → Window management ---
BTN_TL-BTN_TR-BTN_SOUTH = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Fullscreen'"],     label = "Fullscreen" }         # L1+R1+A
BTN_TL-BTN_TR-BTN_NORTH = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Maximize'"],        label = "Maximize/Restore" }  # L1+R1+X
BTN_TL-BTN_TR-BTN_WEST  = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'KrohnkiteToggleFloat'"], label = "Toggle Float" }       # L1+R1+Y
BTN_TL-BTN_TR-BTN_EAST  = { run = ["qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut 'Window Close'"],         label = "Close Window" }       # L1+R1+B

[settings]
CUSTOM_MODIFIERS = "BTN_TL-BTN_TR-BTN_MODE"   # Layer-modifier buttons (L1, R1, Steam)

# Right stick → mouse (makima takes over, Steam group 25 inactive)
RSTICK = "cursor"
RSTICK_SENSITIVITY = "4"   # Polling interval in ms (4 = 250Hz)
RSTICK_DEADZONE = "15"     # Deadzone against stick drift (value * 200 = raw threshold)

16_BIT_AXIS = "true"   # Steam Deck uses 16-bit axis values like Xbox

# Trackpad configuration
# mode = "mt-trackpad" → virtual uinput MT device (libinput/gestures)
# mode = "trackball"   → firmware trackball (TRACKPAD_RELATIVE_MOUSE via HID)
# mode = "disabled"    → state export only, no device (default)
# combined_gesture_device = true → "Deckery Combined Trackpad" when both pads active simultaneously

[trackpad]
combined_gesture_device = true

[trackpad.right]
mode = "mt-trackpad"

[trackpad.left]
mode = "disabled"
