# Voice Control — OpenWhispr push-to-talk.
#
# Optional: delete this file, or switch the module off in the tray, and the
# binding disappears with it.

[remap]
# --- L1 + R5 → OpenWhispr (Ctrl + PageDown), push-to-talk: hold while speaking ---
L1-R5 = { keys = ["KEY_LEFTCTRL", "KEY_PAGEDOWN"], label = "🔊 Text to Speech (Ctrl+PgDn)", note = "halten" }
